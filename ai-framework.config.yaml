# ai-framework.config.yaml
# ---------------------------------------------------------------------------
# Top-level configuration for the ai-framework folder.
#
# Agents (planning, code, testing and review) read this file FIRST, before any skill or loop.
# It says where each framework lives, which API/UI codebase is the active
# development target, where per-feature output is written, and where tickets
# are pushed.
#
# All paths are relative to the ai-framework root (the folder holding this file).
#
# This file is safe to commit: it holds no secrets. The `secrets` section only
# names environment variables; their values live in your shell / user
# environment, never here.
#
# Placeholders look like <your-org>. If an agent needs a value that is still a
# placeholder, it must stop and report rather than guess.
# ---------------------------------------------------------------------------

config_version: 1

# ---------------------------------------------------------------------------
# Runtime
# Which agent runtime or tool performs the work for each role. The shared
# default applies unless a per-role override is set. User preferences in
# user-preferences.yaml take precedence over both (see README.md → Runtime configuration).
#
# One file per machine: each person runs the framework on their own bot machine,
# so only one person's preferences live on a given machine.
#
# Agents running under a different runtime than their assigned role must stop
# and hand off rather than silently running under the wrong subscription.
#
# Supported runtimes:
#   cursor        - Cursor Cloud Agents (Cursor-managed VMs), coordinated from
#                   the bot machine. This is the default. Local Windows PC
#                   execution is NEVER the default; local-machine execution
#                   (Cursor IDE on a developer's machine) is opt-in only via
#                   user-preferences.yaml.
#   claude-code   - Claude Code or other Claude interfaces
#   (more runtimes can be added later)
#
# The bot machine coordinates all work. The framework runs on the bot machine
# (always-on Linux), not on Neil's Windows PC, which may be switched off.
# ---------------------------------------------------------------------------
runtime:
  default: cursor                        # shared default: Cursor Cloud Agents (Cursor-managed VMs)
  # Per-role overrides (optional). Uncomment and set to override the default for specific roles.
  # planning: cursor
  # code: cursor
  # review: cursor
  # testing: cursor

# ---------------------------------------------------------------------------
# Frameworks
# ---------------------------------------------------------------------------
frameworks:
  planning:
    path: ai-planning-framework          # skills, loops, templates, Excel generator
    agent_brief: ai-planning-framework/AGENT-BRIEF.md
    loop: ai-planning-framework/loops/feature-planning.md
  code:
    path: ai-code-framework              # API and UI reference codebases
    rules: ai-code-framework/.cursor/rules   # cross-codebase rules (e.g. api-json-schema-forms.mdc)
    agent_brief: ai-code-framework/AGENT-BRIEF.md
    loop: ai-code-framework/loops/feature-build.md
  review:
    path: ai-review-framework            # PR review skills, loop, checklists, report templates
    agent_brief: ai-review-framework/AGENT-BRIEF.md
    loop: ai-review-framework/loops/pr-review.md
    checklists: ai-review-framework/checklists
  testing:
    # scenario test planning, unit + e2e test skills, loop, checklists, report templates
    path: ai-test-framework
    agent_brief: ai-test-framework/AGENT-BRIEF.md
    loop: ai-test-framework/loops/feature-test.md
    checklists: ai-test-framework/checklists

# ---------------------------------------------------------------------------
# Agents (roles)
# The framework docs refer to ROLES, not agent names: "the planning agent",
# "the implementing agent", "the testing agent", "the reviewing agent" and
# "the human owner". This
# block maps each role to the agent currently filling it, so any agent can
# follow the frameworks. To give a role to a different agent, change its `name`
# here; the docs need no edits.
#   role  -> config key: planning agent = agents.planning, implementing agent =
#            agents.code, testing agent = agents.testing, reviewing agent =
#            agents.review, human owner = agents.human
#   name  -> who to message for that role (handoff/templates/handoff-message.md)
#   id    -> machine-readable value for `owner` / `updated_by` in every handoff.md.
#            Keep ids stable: existing handoff.md files and the pipeline use them.
#            test-bot is never an `owner`: testing runs alongside the review
#            (testing.mode) and test-bot writes only handoff.md `testing` + tests/.
# One agent per framework. Each agent owns its framework and only works a
# feature while it is the `owner` in that feature's handoff file (see
# `handoff` below and handoff/README.md).
# ---------------------------------------------------------------------------
agents:
  planning:
    role: planning agent
    name: Plan Bot                       # agent currently in this role
    id: plan-bot                         # value used for `owner` in handoff.md
    framework: ai-planning-framework
    agent_brief: ai-planning-framework/AGENT-BRIEF.md
    loop: ai-planning-framework/loops/feature-planning.md
    hands_off_to: code                   # via handoff.plan_to_code
  code:
    role: implementing agent
    name: Dev Bot
    id: dev-bot
    framework: ai-code-framework
    agent_brief: ai-code-framework/AGENT-BRIEF.md
    loop: ai-code-framework/loops/feature-build.md
    # via handoff.code_to_review, AND notifies testing via handoff.code_to_test
    hands_off_to: review
  review:
    role: reviewing agent
    name: Review Bot
    id: review-bot
    framework: ai-review-framework
    agent_brief: ai-review-framework/AGENT-BRIEF.md
    loop: ai-review-framework/loops/pr-review.md
    # findings go back via handoff.review_feedback: code defects -> code,
    # test defects -> testing (testing.defect_routing); approval -> human
    hands_off_to: code
  testing:
    role: testing agent
    name: Test Bot
    # `updated_by` in handoff.md `testing` only; never an `owner` value
    # (no test stage: tests run alongside the review, testing.mode)
    id: test-bot
    framework: ai-test-framework
    agent_brief: ai-test-framework/AGENT-BRIEF.md
    loop: ai-test-framework/loops/feature-test.md
    # messages the reviewing agent when a test run finishes (review trigger test-report)
    hands_off_to: review
  human:
    role: human owner                    # approves the gates and does the merge
    name: Neil Wood
    id: human                            # owner while waiting on an approval or the merge

# ---------------------------------------------------------------------------
# Development target
# Pick ONE api and ONE ui with `active:`. The value must match a key under
# `options`. Each option keeps its own rules/skills inside its folder; read
# those and the code-framework rules above.
# ---------------------------------------------------------------------------
development:
  api:
    active: api-framework                # csharp-api | api-framework  (confirm before code work)
    options:
      csharp-api:
        path: ai-code-framework/api/CSharp.API
        available: false                 # reference-only; not an active development target
        stack: .NET (net10.0), C# solution
        description: >-
          C# / .NET BFF-style API. V2 controllers, downstream clients and
          mappers, entity-list (grid) endpoints, JSON schema form/wizard
          endpoints, bulk import, and local persistence via DbContext
          (EF entities and migrations).
        agent_docs: [AGENTS.md, CLAUDE.md]
        rules: ai-code-framework/api/CSharp.API/.cursor/rules
        skills: ai-code-framework/api/CSharp.API/.cursor/skills
      api-framework:
        repo_url: https://github.com/NeilWoodComputing/ai-framework-tests
        repo_path: api/
        path: ai-code-framework/api/API.Framework
        stack: .NET (net10.0), solution Api.Framework.sln
        description: >-
          Reference API for JSON schema forms and wizards. Single forms extend
          AbstractFormRecord (CatalogueItemRecord); wizards extend
          JsonSchemaWizardRecord (ComponentShowcaseRecord). Schemas under
          Validation/Schemas; EF models in Api.Framework.Data.
        agent_docs: [AGENTS.md, CLAUDE.md]
        rules: ai-code-framework/api/API.Framework/.cursor/rules
        skills: ai-code-framework/api/API.Framework/.cursor/skills

  ui:
    active: nextjs                      # angular | nextjs  (confirm before code work)
    options:
      angular:
        path: ai-code-framework/ui/UI.Angular.Framework
        available: false                 # reference-only; not an active development target
        stack: Angular 20, Angular Material, Bootstrap, ag-Grid, JSON Forms
        description: >-
          Angular UI framework shell. Shared framework in src/framework/;
          domain features as git submodules under src/app/submodules/.
          Pattern rules for entity grids, JSON schema forms, modal routing,
          datasets, charts and bulk import. Pairs with the C# API (v2 routes).
        agent_docs: [CLAUDE.md, README.md]
        rules: ai-code-framework/ui/UI.Angular.Framework/.cursor/rules
        feature_spec: ai-code-framework/ui/UI.Angular.Framework/src/app/submodules/Example.Subrepo/README.md
      nextjs:
        repo_url: https://github.com/NeilWoodComputing/ai-framework-tests
        repo_path: ui/
        path: ai-code-framework/ui/UI.NextJs.Framework
        stack: Next.js 15, React 19, JSON Forms, react-hook-form
        description: >-
          System UI Next (package system-ui-next): frontend-only Next.js starter
          mirroring the Angular framework layout. Calls the active API via
          NEXT_PUBLIC_SYSTEM_API_ROOT (API.Framework, no /v1); falls back to the C# API v2
          when that is unset (environment.ts, kept by decision D14).
          Follow README.md, AGENTS.md and .cursor/rules (component library,
          grids, JSON schema forms, modal routing).
        agent_docs: [AGENTS.md, README.md]
        rules: ai-code-framework/ui/UI.NextJs.Framework/.cursor/rules

# ---------------------------------------------------------------------------
# Project
# The development project the planning framework is working for. Everything
# project-specific (services, permission pattern, DB naming, grid header label,
# ticket domain tokens, stack hints, which rules are on) lives in the profile,
# not in the framework. See ai-planning-framework/projects/README.md.
# ---------------------------------------------------------------------------
project:
  active: candc
  profile: project.yaml                 # beside this file, outside the planning framework
  # NEW features are planned here: <project.work_dir>/<feature-slug>/
  # (the one work folder; domain-neutral)
  work_dir: ai-planning-framework/work

# ---------------------------------------------------------------------------
# Output
# Every feature is written under a work folder: <work_dir>/<feature-slug>/
# using these folders. The authoritative folder for one feature is
# `feature_path` in its handoff.md.
# ---------------------------------------------------------------------------
output:
  # the feature folder: new and existing features (older features predate the
  # project profiles; their paths stay valid)
  work_dir: ai-planning-framework/work
  # every work folder, searched in order for <feature-slug>/ when no
  # feature_path is known
  work_dirs:
    # = project.work_dir = output.work_dir
    - ai-planning-framework/work
  feature_layout:
    plan: plan.md                        # plan-feature
    specs: specs                         # page YAML (source of truth for UI <-> DB)
    excel: excel                         # generated .xlsx (generators/excel_spec.py -o ...)
    journeys: journeys                   # user journeys
    tickets: tickets                     # Given / When / Then stories (only source for tracker items)
    stubs: stubs                         # framework-agnostic UI <-> DB stubs
    devops: devops                       # optional dry-run publish-plan.md
    # review reports (review.report_names) + review-log.md (review.log_file),
    # by ai-review-framework
    reviews: reviews
    # test plan, run reports and test log (testing.report_names),
    # by ai-test-framework; the testing agent may write here while
    # review-bot owns the feature
    tests: tests
    handoff: handoff.md                  # pipeline state for the feature (handoff/templates/handoff.md)

# ---------------------------------------------------------------------------
# Tickets
# Where stories from output.work_dir/<feature>/tickets/ are published.
# Keep `enabled: false` until DevOps access exists AND the placeholders below
# are filled in. While disabled, agents may only write a dry-run plan.
# ---------------------------------------------------------------------------
tickets:
  enabled: false
  # azure-devops | github | jira
  # (adapter: ai-planning-framework/skills/publish-tickets/adapters/<target>.md;
  # github and jira are stubs)
  target: azure-devops
  azure_devops:
    organisation: <your-org>             # e.g. the name in https://dev.azure.com/<your-org>
    project: <your-project>
    area_path: <your-project>\<your-area>
    iteration_path: <your-project>\<your-iteration>
    work_item_types:
      story: User Story
      task: Task
    default_tags:
      - ai-planning-framework
  id_prefix: T-<DOMAIN>-NNN              # e.g. T-CONTACT-001; filename T-<DOMAIN>-NNN-<slug>.md
  upsert: true                           # match on stable ID; update, never duplicate

# ---------------------------------------------------------------------------
# Review
# How ai-review-framework gets a change (pull request or direct hand-off), when
# it asks for changes, and whether it may post back to the PR. Reviews are
# AUTOMATIC: the reviewing agent (agents.review) starts on any trigger below;
# nobody has to ask.
# PR posting is supported for GitHub and Azure DevOps: see `publish`.
# Whatever the provider, agents always write the full report and the review log
# under output.work_dir/<feature>/reviews/ on every round.
# ---------------------------------------------------------------------------
review:
  # Where PRs are read from (PR route, pr-opened / pr-updated triggers). Read-only.
  #   azure-devops  - Azure DevOps connector + secrets.azure_devops_pat_env
  #   github        - a connected GitHub connector where available, else secrets.github_token_env
  #   cursor-origin - the Cursor Origin connector (pull request read, compare commits,
  #                   get file contents, list commits); no token env var needed
  #   local-git     - git diff <target>...<source> in local clones; also how to review a
  #                   local clone of an Origin (or GitHub) repo
  provider: github                       # azure-devops | github | cursor-origin | local-git
  # only needed for the PR route (when the PR states no target) or direct_scope: diff
  target_branch: main
  local_git:
    # PR route (and direct_scope: diff) only.
    # Runs `git diff <target_branch>...<source_branch>` in each repo below.
    # `active` = the active development.api and development.ui paths.
    repo_paths: active
  azure_devops:
    organisation: <your-org>             # usually the same as tickets.azure_devops.organisation
    project: <your-project>              # usually the same as tickets.azure_devops.project
    repository: <your-repo>
  github:
    # Read through a connected GitHub connector where available; otherwise the
    # token env var named in secrets.github_token_env.
    # Covers PRs on both AI-framework (the framework itself) and ai-framework-tests
    # (app code in api/ and ui/). Repository can be a list or inferred from the PR.
    owner: NeilWoodComputing
    repositories: [AI-framework, ai-framework-tests]
  cursor_origin:
    # Read through the Cursor Origin connector (the user's connected account).
    # No token env var: nothing for this provider goes in `secrets`.
    namespace: <your-origin-namespace>   # Origin namespace (owner) slug, as the connector lists it
    repository: <your-repo>              # repository name within that namespace
  # Lowest severity that forces "Request changes": blocker | major | minor.
  # Any Blocker, or any unmet mandatory spec control / DB mapping, always does.
  severity_threshold: major

  # Automatic review: the reviewing agent reviews as soon as a trigger fires, with
  # no human request. pr-opened / pr-updated = handoff.code_to_review: pr;
  # direct-handoff = the implementing agent messages the reviewing agent with the
  # feature's handoff.md path; test-report = the testing agent messages the
  # reviewing agent that a test run finished (handoff.md `testing`), which starts
  # the test review (testing.test_review).
  auto_review: true
  triggers: [pr-opened, pr-updated, direct-handoff, test-report]

  # What a direct-route review (handoff.code_to_review: direct) looks at.
  #   plan (default): ALL code relevant to the feature's plan. The reviewing
  #         agent starts from the implementing agent's `implementation` manifest
  #         in handoff.md, cross-checks it by searching the active API / UI paths
  #         for the plan's pages, routes, Services, tables, columns, ticket IDs
  #         and derived DTO / entity names, and reviews the full current contents
  #         of every file in scope. Needs no git, no branch and no target_branch.
  #   diff: the old behaviour: git diff <base_branch>...<branch> in each repo
  #         (needs git repos and a base / target branch).
  # The PR route always reviews the PR diff.
  direct_scope: plan                     # plan | diff

  # The ONLY folders whose files are ever reviewed, on every route (direct plan
  # scope, direct diff, PR). Review scope per repo:
  # - AI-framework: framework folders, handoff, scripts, tests, root config and README
  # - ai-framework-tests: api/ and ui/ (app code)
  # Planning artefacts (specs, tickets, stubs, Excel) are read as the reference
  # for what should be built, but are never reviewed. scope_exclude still applies.
  scope_include:
    # AI-framework (framework changes)
    - "ai-planning-framework/**"
    - "ai-code-framework/**"
    - "ai-review-framework/**"
    - "ai-test-framework/**"
    - "handoff/**"
    - "scripts/**"
    - "tests/**"
    - "ai-framework.config.yaml"
    - "project.yaml"
    - "README.md"
    # ai-framework-tests (app code in api/ and ui/)
    - "api/**"
    - "ui/**"

  # Never in a review scope (any route): build output, dependencies, generated
  # files and secrets. Secret files are never opened. Add patterns as needed.
  scope_exclude:
    - "**/bin/**"
    - "**/obj/**"
    - "**/node_modules/**"
    - "**/.next/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/coverage/**"
    - "**/TestResults/**"
    - "**/artifacts/**"
    - "**/.*-out/**"                     # e.g. API .test-out, .agent-test-out
    - "**/*.g.cs"
    - "**/*.min.js"
    - "**/package-lock.json"
    - "**/.env*"
    - "**/secrets.json"
    - "**/*.pfx"
    - "**/*.pem"
    - "**/*.key"

  # Append-only history of every review round, whichever route was used:
  # output.work_dir/<feature>/<output.feature_layout.reviews>/<log_file>
  # (template: ai-review-framework/templates/review-log.md).
  log_file: review-log.md

  # Full report per round, next to the log. {braces} are filled per review.
  report_names:
    pr: PR-{pr-id}-review.md                       # overwritten on each PR update
    direct: DIRECT-{branch-slug}-{n}-review.md     # new file per round; n = review round (1, 2, ...)
    direct_no_branch: DIRECT-{feature}-{n}-review.md   # direct route when handoff.md records no branch

  publish:
    # PR posting is supported for GitHub and Azure DevOps providers.
    # GitHub: Posts comments using the COMMENT review event (never APPROVE or REQUEST_CHANGES).
    #         Agents never approve, request changes as a blocking vote, or merge.
    # Azure DevOps: Posts as PR threads when enabled with the DevOps connector.
    # cursor-origin and local-git: Never post; the review is the report + review-log.md only.
    # The report and review log are written on every round either way.
    enabled: true                        # GitHub posting is active when review.provider is github
    # when enabled: post on every PR-route review round automatically,
    # no request needed
    auto_post_on_pr: true
    post_inline_comments: true           # one comment per finding (templates/review-comment.md)
    post_summary_comment: true           # verdict + summary + report path
    # stays false: agents never approve, reject or merge; the human owner decides
    set_vote: false                      # GitHub: COMMENT event only, never APPROVE/REQUEST_CHANGES

# ---------------------------------------------------------------------------
# Handoff
# How work moves planning agent -> implementing agent -> reviewing agent AND
# testing agent (in parallel) -> (back to implementing agent | testing agent |
# human owner). Role -> agent: `agents` above.
# Rules, stages and the message format: handoff/README.md.
# Every transition updates <work_dir>/<feature>/<handoff_file>.
# ---------------------------------------------------------------------------
handoff:
  spec: handoff/README.md
  template: handoff/templates/handoff.md
  message_template: handoff/templates/handoff-message.md
  handoff_file: handoff.md               # lives in each feature folder: <work_dir>/<feature>/handoff.md

  # Planning agent -> implementing agent
  #   devops: publish tickets to the board (publish-tickets); the implementing
  #           agent picks the work items up from the board. Requires tickets.enabled: true,
  #           no <placeholders> under tickets, and the DevOps connector.
  #   direct: write handoff.md and message the implementing agent with the feature path.
  # Default is direct while tickets.enabled is false.
  plan_to_code: direct                   # devops | direct

  # Implementing agent -> reviewing agent. Either way the review starts automatically
  # (review.auto_review / review.triggers); no human asks for it.
  #   pr:     raise a PR (title / branch include T-<DOMAIN>-NNN). Opening or
  #           updating the PR triggers the review (pr-opened / pr-updated). Until
  #           a DevOps service hook exists, the implementing agent also messages
  #           the reviewing agent with the PR id. Requires review.provider
  #           configured (no <placeholders>).
  #   direct: record the implementation manifest (and branch / head commit if the
  #           repo is under git) in handoff.md and message the reviewing agent
  #           (direct-handoff). The reviewing agent reviews all code relevant to
  #           the plan (review.direct_scope: plan), or a local git diff when
  #           direct_scope is diff.
  code_to_review: pr                     # pr | direct

  # Implementing agent -> testing agent, at the SAME TIME as code_to_review (Neil,
  # 2026-10-08 19:07 BST, option B). No new stage: the feature stays in-review,
  # owned by review-bot. The testing agent writes and runs the scenario tests,
  # records results in handoff.md `testing` (carve-out from the one-owner rule,
  # handoff/README.md) and messages the reviewing agent (trigger test-report).
  #   direct: the implementing agent messages the testing agent with the feature path.
  code_to_test: direct                   # direct

  # Reviewing agent -> implementing agent. Findings go in the full report and
  # reviews/<review.log_file>; the reviewing agent messages the implementing agent
  # the report path. On the pr route they are also posted to the PR when
  # review.publish allows (supported on azure-devops and github). Later option: devops
  # (comment on the work item).
  review_feedback: direct                # direct

  # Review rounds before the feature goes to the human owner instead of back to the implementing agent.
  max_review_cycles: 3

  # Branch name used in every repo the feature touches (same name in API and UI).
  # Must contain the stable ticket ID so the review can link specs. The
  # <type>/<id>/<slug> shape matches existing API branches (e.g.
  # feat/79242/...). {braces} are filled per feature by the implementing agent;
  # they are not <placeholders> for you to set.
  branch_pattern:
    devops: feat/{work-item-id}/{ticket-id}-{slug}   # e.g. feat/84700/T-CONTACT-001-add-edit-contact
    direct: feat/{ticket-id}/{slug}                  # e.g. feat/T-CONTACT-001/add-edit-contact

  # Human gates. When true, the agent stops, asks the human owner (agents.human),
  # and records who / when in handoff.md approvals before moving the feature on.
  require_human_approval:
    plan_to_code: true                   # the human owner signs off the plan / tickets before code starts
    # the implementing agent hands to the reviewing agent without asking;
    # the review runs automatically
    code_to_review: false
    code_to_test: false                  # the implementing agent notifies the testing agent without asking
    merge: true                          # agents NEVER merge; the human owner merges. Do not set false.

# ---------------------------------------------------------------------------
# Testing
# How ai-test-framework fits the pipeline (Neil, 2026-10-08 19:07 BST: option B
# plus a review of the tests). When the implementing agent hands off, the
# reviewing agent (code review) and the testing agent (writes and runs the
# scenario tests) start together. The code-review verdict is PROVISIONAL until
# the test run finishes; the reviewing agent then does a TEST REVIEW (report,
# results, test code quality, every claimed scenario has an executed test).
# Final approval needs both, and a blocked or unrun suite does not approve.
# Rules: handoff/README.md -> Testing alongside review.
# Values in <angle brackets> are placeholders: an agent that needs one stops and
# reports. Secrets are env var NAMES only (see `secrets`).
# ---------------------------------------------------------------------------
testing:
  # alongside-review (chosen) | before-review (not used: would need an in-test stage)
  mode: alongside-review
  # the reviewing agent reviews the test report and test code after each run
  test_review: true
  final_approval_requires: [code_review, test_review]
  # DECIDED by Neil (2026-10-08 19:19 BST; replaces flagged default (1)):
  # fixing failing tests has its own cap.
  # test-failure / test-defect fix rounds do NOT count toward
  # handoff.max_review_cycles (3)
  failures_count_toward_review_cycles: false
  # separate from handoff max_review_cycles; on exhaustion escalate to Neil
  # (decided 2026-10-08). Counter: handoff.md testing.test_fix_cycle
  max_test_fix_cycles: 5
  # DECIDED (2): a blocked run, or a required unit command that was not run,
  # does not get final approval. The stage stays in-review and the owner is
  # the human owner. The human owner still merges.
  blocked_tests_allow_approval: false
  # DEFAULTS FLAGGED TO NEIL (not settled; change here if he decides otherwise):
  # (3) tests are tagged with the explicit ticket heading ID <ticket>/S<n>,
  # never heading order; IDs are never renumbered
  scenario_ids: explicit
  ownership:
    # Api.Framework.Tests project; Playwright + playwright-bdd setup and e2e
    # folder in UI.NextJs.Framework
    scaffolding: code
    reset_endpoint: code                 # test-data reset endpoint in API.Framework (Test environment only)
    test_users: code                     # role-based test personas, seeded by the test-data mechanism
    scenario_tests: testing              # unit and e2e tests, one per <ticket>/S<n>, tagged with the scenario ID
    test_runs: testing                   # running the suites and writing tests/ reports + handoff.md `testing`
  defect_routing:
    # failing scenario because the code is wrong -> implementing agent
    # (stage changes-requested)
    code_defects: code
    # weak / mis-tagged / mocked / missing test -> testing agent
    # (stage stays in-review)
    test_defects: testing
  # never run e2e against shared dev / non-prod
  shared_environments_allowed: false
  environment: Test                      # ASPNETCORE_ENVIRONMENT of API.Framework (alternative: E2E)
  database:
    provider: postgresql                 # API.Framework is Npgsql-only
    # dedicated to API.Framework; the reset endpoint refuses any other
    name: <api_framework_test>
    # env var NAME; value set by the human owner only.
    # Test-environment-only (Neil 2026-10-09): user-level, read by Program.cs /
    # LoginDbContextFactory only when the environment is Test;
    # Test Jwt secret: APIFW_TEST_Jwt__Secret
    connection_env: APIFW_TEST_ConnectionStrings__LoginConnection
    # schema only ever built by migrations (owner connection)
    schema_source: Api.Framework.Data/Migrations
    # no DROP / CREATE / CREATEDB
    runtime_user_rights: [USAGE on auth/creatures, SELECT, INSERT, UPDATE, DELETE, TRUNCATE]
    migrate_on_startup: false                             # InitialisationSettings:MigrateDatabase in Test
  ui_base_url: <http://localhost:3003>
  api_base_url: <https://localhost:<api-port>>
  reset_endpoint:
    api: api-framework                   # API.Framework only, not the C# API
    master_route: TestData/Reset/master  # once per full run, or to recover a dirty DB
    # dependency order
    seed_units: [baseline.migration-seed, baseline.test-tenant, "personas.{feature}", "{feature}.{batch}"]
    batch_route: TestData/Reset/{scenarioKey}
    key_format: "{feature}.{batch}.{state}"
    key_header: X-Test-Data-Key
    key_env: E2E_TEST_DATA_KEY           # env var NAME
    requires_signed_in_persona: true
    master_persona: testdata-admin
  personas:                              # test users
    naming: "{feature}-{role}"           # animals-tester, animals-viewer, testdata-admin
    email_domain: <e2e.test>             # reserved, non-routable
    password_env_pattern: E2E_{FEATURE}_{ROLE}_PASSWORD
    tenant: <e2e-test-tenant>
  e2e:
    nextjs:
      # scaffolded by the implementing agent (folder exists, 2026-10-08)
      path: ai-code-framework/ui/UI.NextJs.Framework/e2e
      runner: Playwright + playwright-bdd
      # global setup runs the master reset
      command: npx bddgen && npx playwright test
  # Neil 2026-10-08 20:04: component harness for the shared UI pieces,
  # set up by the implementing agent
  component:
    nextjs:
      # page-based harness (page.tsx -> src/features/test-harness/ComponentTestHarness.tsx)
      path: ai-code-framework/ui/UI.NextJs.Framework/src/app/examples/test-harness
      route: /examples/test-harness
      # exercised by Playwright in the existing e2e stack (testing.e2e.nextjs)
      runner: Playwright + playwright-bdd
      covers: ["T-ANIMAL-006 Switch / Tag Input", "T-ANIMAL-007 row actions menu", "T-ANIMAL-009 boolean circle cells"]
      setup: code                         # harness built and maintained by the implementing agent
      tests: testing                      # scenario tests written and run by the testing agent
  unit:
    # csharp-api: dotnet test CSharp.API.Tests/CSharp.API.Tests.csproj --configuration Release  # unavailable (reference-only)
    # approved 08/10/2026 (Neil); project at
    # ai-code-framework/api/API.Framework/Api.Framework.Tests, scaffolded by
    # the implementing agent (folder exists, 2026-10-08)
    api-framework: dotnet test Api.Framework.Tests/Api.Framework.Tests.csproj --configuration Release
  report_names:
    plan: tests/test-plan.md
    report: tests/TEST-<feature>-<n>-report.md   # n = test round (handoff.md testing.round)
    log: tests/test-log.md
  forbid_frontend_mocks: true

# ---------------------------------------------------------------------------
# Verification (pre-handoff gate)
# Run by the implementing agent in feature-build stage 5 (re-run after stage 6);
# the last run is recorded in handoff.md code.verification +
# code.pre_handoff_gate. A failed or missing gate blocks in-review
# (handoff/README.md rule 12).
# Decided by Neil 2026-10-09 10:32 BST (pre-handoff-checks plan D1-D17).
# Runner and allowlist exist (built by Dev Bot, T-GATE-003..005, 2026-10-09).
# Flags: --target api-framework|nextjs|all, --feature <work/<feature> or its
# handoff.md>, --record <handoff.md>, --json. Nothing secret here: the scanner
# prints file, key path and rule only.
# ---------------------------------------------------------------------------
verification:
  # D4, D15 (Node, no dependencies)
  runner: node ai-code-framework/scripts/pre-handoff-checks.mjs
  # D13: entries have reason, owner, expires; no values
  allowlist: ai-code-framework/scripts/pre-handoff-allowlist.json
  fail_on_warnings: false                # D3: errors fail; warnings counted and recorded
  # failed / missing gate blocks in-development|changes-requested -> in-review
  blocks_handoff: true
  # D14: targets without git: working tree minus review.scope_exclude
  not_in_git: scan-working-tree
  # D17: fallback touched-files + recorded baseline only if T-GATE-001 cannot
  # reach a clean baseline
  scope: whole-target
  targets:
    api-framework:
      path: ai-code-framework/api/API.Framework
      end_of_line: crlf                  # D5
      checks: [eol, secrets, docs-dup, unit]   # unit = testing.unit.api-framework (D6)
    nextjs:
      path: ai-code-framework/ui/UI.NextJs.Framework
      # D5 (*.ps1 / *.cmd / *.bat crlf in both targets)
      end_of_line: lf
      # lint = npm run lint, typecheck = npm run typecheck, unit = npm test (vitest)
      checks: [lint, typecheck, eol, secrets, docs-dup, unit]
      # D11: e2e/ is secrets-scanned but not linted / typechecked
      lint_exclude: [e2e/]
  charset: utf-8                         # D7: no BOM
  docs_dup_min_words: 25                 # D8

# ---------------------------------------------------------------------------
# Secrets
# Environment variable NAMES only. Never put values in this file.
# ---------------------------------------------------------------------------
secrets:
  azure_devops_pat_env: AZURE_DEVOPS_PAT   # personal access token for Azure DevOps
  # AZURE_DEVOPS_PAT is also used by review.provider: azure-devops.
  # only needed when review.provider is github AND no GitHub connector connected
  github_token_env: GITHUB_TOKEN
  # review.provider: cursor-origin needs no env var: it reads through the Cursor
  # Origin connector. Testing (testing block). Values are set by the human owner
  # in the test environment only.
  # Test-environment-only (Neil 2026-10-09): user-level, read only when the
  # environment is Test. Test Jwt secret env var: APIFW_TEST_Jwt__Secret
  test_db_connection_env: APIFW_TEST_ConnectionStrings__LoginConnection
  test_data_reset_key_env: E2E_TEST_DATA_KEY
  # e.g. E2E_ANIMALS_TESTER_PASSWORD, E2E_TESTDATA_ADMIN_PASSWORD
  test_persona_password_env_pattern: E2E_{FEATURE}_{ROLE}_PASSWORD
