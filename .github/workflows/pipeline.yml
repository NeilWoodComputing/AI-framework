name: pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
    
    - name: Set up Python
      uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3  # v5.2.0
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install Python dependencies
      run: pip install pyyaml
    
    - name: Run config validation
      run: python3 tests/validate-config.py
    
    - name: Run framework consistency checks
      run: python3 tests/check-framework.py

  lint:
    name: Lint code and configuration
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
    
    - name: Set up Python
      uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3  # v5.2.0
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Set up Node.js
      uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6  # v4.0.4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    
    - name: Install PowerShell
      run: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https software-properties-common
        wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
        sudo dpkg -i packages-microsoft-prod.deb
        rm packages-microsoft-prod.deb
        sudo apt-get update
        sudo apt-get install -y powershell
    
    - name: Cache PowerShell modules
      uses: actions/cache@v4
      with:
        path: ~/.local/share/powershell/Modules
        key: ${{ runner.os }}-pwsh-${{ hashFiles('**/*.ps1') }}
        restore-keys: |
          ${{ runner.os }}-pwsh-
    
    - name: Install linting tools
      run: |
        pip install yamllint
        sudo apt-get install -y shellcheck
        npm install -g markdownlint-cli
        pwsh -Command "Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck"
    
    - name: Run shellcheck
      run: shellcheck scripts/init-user.sh scripts/test.sh
    
    - name: Run PSScriptAnalyzer
      run: pwsh -Command "Invoke-ScriptAnalyzer -Path scripts/init-user.ps1 -Settings PSGallery"
    
    - name: Run yamllint
      run: yamllint ai-framework.config.yaml user-preferences.example.yaml
    
    - name: Run markdownlint
      run: |
        markdownlint README.md \
          ai-planning-framework/AGENT-BRIEF.md \
          ai-code-framework/AGENT-BRIEF.md \
          ai-review-framework/AGENT-BRIEF.md \
          ai-test-framework/AGENT-BRIEF.md \
          handoff/README.md

  test:
    name: Run test suite
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
    
    - name: Set up Python
      uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3  # v5.2.0
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install PowerShell
      run: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https software-properties-common
        wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
        sudo dpkg -i packages-microsoft-prod.deb
        rm packages-microsoft-prod.deb
        sudo apt-get update
        sudo apt-get install -y powershell
    
    - name: Cache PowerShell modules
      uses: actions/cache@v4
      with:
        path: ~/.local/share/powershell/Modules
        key: ${{ runner.os }}-pwsh-${{ hashFiles('**/*.ps1') }}
        restore-keys: |
          ${{ runner.os }}-pwsh-
    
    - name: Install test dependencies
      run: |
        pip install pyyaml
        sudo apt-get install -y bats
        pwsh -Command "Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck"
    
    - name: Run bash script tests
      run: bats tests/init-user.bats
    
    - name: Run PowerShell script tests
      run: pwsh -Command "Invoke-Pester tests/init-user.Tests.ps1 -Output Detailed"
